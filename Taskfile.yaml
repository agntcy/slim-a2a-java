version: "3"

env:
  # exec:java runs in Maven's own JVM, and slim-bindings-java is compiled with
  # preview features (FFM API on Java 21), so the flags have to reach that JVM.
  MAVEN_OPTS: --enable-preview --enable-native-access=ALL-UNNAMED

tasks:
  generate:
    desc: Generate SlimRPC stubs from A2A proto
    cmds:
      - buf generate

  build:
    desc: Build all modules
    cmds:
      - mvn clean install -DskipTests

  test:
    desc: Run tests
    cmds:
      - mvn test

  echo-server:
    desc: Run echo agent server
    deps:
      - build
    dir: examples/echo-agent
    cmds:
      - >
        mvn clean compile exec:java
        -Dexec.mainClass=io.agntcy.slim.a2a.examples.echo.ServerMain
        {{.CLI_ARGS}}

  echo-client:
    desc: Run echo agent client
    deps:
      - build
    dir: examples/echo-agent
    cmds:
      - >
        mvn clean compile exec:java
        -Dexec.mainClass=io.agntcy.slim.a2a.examples.echo.ClientMain
        {{.CLI_ARGS}}
